name: Release BTT Reminder (Public Pipeline)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release summary notes for this version (optional override)'
        required: false
        default: 'Hotfix for Notes in Version 2: Fixed new-line/Return handling in the Notes editor, Note title editing, rich-text editor state synchronization, and formatting reliability.'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: macos-latest
    env:
      SOURCE_SHA: cc3ffdf778e9f9e40498cdd1f3fcfe234c6d92fe
      EXPECTED_VERSION: 2.0.1
      EXPECTED_BUILD: "11"

    steps:
      - name: Pre-flight Secret Presence Check
        env:
          HAS_SOURCE_PAT: ${{ secrets.SOURCE_REPO_PAT != '' }}
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          if [ "${HAS_SOURCE_PAT}" != "true" ]; then
            echo "Error: Required secret SOURCE_REPO_PAT is missing or empty!" >&2
            exit 1
          fi
          if [ "${HAS_SPARKLE_KEY}" != "true" ]; then
            echo "Error: Required secret SPARKLE_ED_PRIVATE_KEY is missing or empty!" >&2
            exit 1
          fi
          echo "Pre-flight secret presence check passed."

      - name: Checkout Public Release Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Exclusion for Source Safety
        run: |
          mkdir -p .git/info
          echo "source/" >> .git/info/exclude

      - name: Checkout Private Source Repository
        uses: actions/checkout@v4
        with:
          repository: truthrive/btt-reminder
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          path: source
          fetch-depth: 0

      - name: Validate Source Lock, Version and V2 Migration
        run: |
          cd source
          ACTUAL_SHA=$(git rev-parse HEAD)

          if [ "${ACTUAL_SHA}" != "${SOURCE_SHA}" ]; then
            echo "Error: Checked out SHA ${ACTUAL_SHA} does not match required SHA ${SOURCE_SHA}" >&2
            exit 1
          fi
          echo "Verified exact private source SHA: ${ACTUAL_SHA}"

          PBX_FILE="BTTReminder.xcodeproj/project.pbxproj"
          VERSION_COUNT=$(grep -c "MARKETING_VERSION = ${EXPECTED_VERSION};" "${PBX_FILE}" || true)
          BUILD_COUNT=$(grep -c "CURRENT_PROJECT_VERSION = ${EXPECTED_BUILD};" "${PBX_FILE}" || true)

          if [ "${VERSION_COUNT}" -ne 2 ]; then
            echo "Error: Expected exactly 2 MARKETING_VERSION = ${EXPECTED_VERSION} entries, found ${VERSION_COUNT}." >&2
            exit 1
          fi
          if [ "${BUILD_COUNT}" -ne 2 ]; then
            echo "Error: Expected exactly 2 CURRENT_PROJECT_VERSION = ${EXPECTED_BUILD} entries, found ${BUILD_COUNT}." >&2
            exit 1
          fi

          STORE="Sources/BTTCore/Services/PersistenceStore.swift"
          MIGRATION="Sources/BTTCore/Migration/MigrationV1ToV2.swift"
          test -f "${STORE}" || { echo "Error: ${STORE} missing" >&2; exit 1; }
          test -f "${MIGRATION}" || { echo "Error: ${MIGRATION} missing" >&2; exit 1; }

          grep -q 'probe.schemaVersion == 2' "${STORE}" || { echo "Error: V2 schema load path missing" >&2; exit 1; }
          grep -q 'probe.schemaVersion == 1' "${STORE}" || { echo "Error: V1-to-V2 migration entry path missing" >&2; exit 1; }
          grep -q 'DataStoreEnvelope(schemaVersion: 2' "${STORE}" || { echo "Error: V2 persistence write path missing" >&2; exit 1; }
          grep -q 'data_v1.json.bak_pre_v2' "${STORE}" || { echo "Error: pre-V2 immutable backup path missing" >&2; exit 1; }

          echo "Source validated: ${EXPECTED_VERSION} (build ${EXPECTED_BUILD}), V1 -> V2 migration path present."
          cd ..

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Resolve SPM Dependencies
        run: |
          cd source
          swift package resolve
          cd ..

      - name: Run SPM Unit Tests
        run: |
          cd source
          swift test --verbose
          cd ..

      - name: Run Xcode Tests
        run: |
          cd source
          xcodebuild test \
            -project BTTReminder.xcodeproj \
            -scheme BTTReminder \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES
          cd ..

      - name: Build BTT Reminder Release Target
        run: |
          cd source
          xcodebuild build \
            -project BTTReminder.xcodeproj \
            -scheme BTTReminder \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES

          BUILD_DIR=$(xcodebuild -project BTTReminder.xcodeproj -scheme BTTReminder -configuration Release -showBuildSettings | awk -F ' = ' '/TARGET_BUILD_DIR/ {print $2; exit}')
          APP_PATH="${BUILD_DIR}/BTT Reminder.app"

          if [ ! -d "${APP_PATH}" ]; then
            echo "Error: BTT Reminder.app not found at ${APP_PATH}" >&2
            exit 1
          fi

          codesign --force --deep --sign - "${APP_PATH}"
          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          echo "App bundle built and codesigned successfully at: ${APP_PATH}"
          cd ..

      - name: Verify App Bundle and Run Smoke Test
        run: |
          cd source
          BUILD_DIR=$(xcodebuild -project BTTReminder.xcodeproj -scheme BTTReminder -configuration Release -showBuildSettings | awk -F ' = ' '/TARGET_BUILD_DIR/ {print $2; exit}')
          APP_PATH="${BUILD_DIR}/BTT Reminder.app"
          EXECUTABLE="${APP_PATH}/Contents/MacOS/BTT Reminder"
          FRAMEWORK_PATH="${APP_PATH}/Contents/Frameworks/BTTCore.framework"
          SPARKLE_PATH="${APP_PATH}/Contents/Frameworks/Sparkle.framework"

          test -d "${FRAMEWORK_PATH}" || { echo "Error: Embedded BTTCore.framework missing" >&2; exit 1; }
          test -d "${SPARKLE_PATH}" || { echo "Error: Sparkle.framework missing" >&2; exit 1; }

          OUTPUT_LOG=$(mktemp)
          "${EXECUTABLE}" > "${OUTPUT_LOG}" 2>&1 &
          APP_PID=$!
          sleep 3

          if kill -0 "${APP_PID}" 2>/dev/null; then
            echo "Smoke launch test passed."
            kill -TERM "${APP_PID}" 2>/dev/null || true
            wait "${APP_PID}" 2>/dev/null || true
            rm -f "${OUTPUT_LOG}"
          else
            echo "Smoke launch test failed!" >&2
            cat "${OUTPUT_LOG}" >&2
            rm -f "${OUTPUT_LOG}"
            exit 1
          fi
          cd ..

      - name: Extract and Validate Built Info.plist
        id: version_info
        run: |
          cd source
          BUILD_DIR=$(xcodebuild -project BTTReminder.xcodeproj -scheme BTTReminder -configuration Release -showBuildSettings | awk -F ' = ' '/TARGET_BUILD_DIR/ {print $2; exit}')
          APP_PATH="${BUILD_DIR}/BTT Reminder.app"
          PLIST_PATH="${APP_PATH}/Contents/Info.plist"

          test -f "${PLIST_PATH}" || { echo "Error: Info.plist missing at ${PLIST_PATH}" >&2; exit 1; }

          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "${PLIST_PATH}" 2>/dev/null)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "${PLIST_PATH}" 2>/dev/null)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "${PLIST_PATH}" 2>/dev/null)
          FEED_URL=$(/usr/libexec/PlistBuddy -c "Print SUFeedURL" "${PLIST_PATH}" 2>/dev/null)
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c "Print SUPublicEDKey" "${PLIST_PATH}" 2>/dev/null)
          AUTO_CHECKS=$(/usr/libexec/PlistBuddy -c "Print SUEnableAutomaticChecks" "${PLIST_PATH}" 2>/dev/null)
          AUTO_UPDATE=$(/usr/libexec/PlistBuddy -c "Print SUAutomaticallyUpdate" "${PLIST_PATH}" 2>/dev/null)

          if [ "${VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "Error: Expected version ${EXPECTED_VERSION}, got '${VERSION}'" >&2
            exit 1
          fi
          if [ "${BUILD}" != "${EXPECTED_BUILD}" ]; then
            echo "Error: Expected build ${EXPECTED_BUILD}, got '${BUILD}'" >&2
            exit 1
          fi
          if [ "${BUNDLE_ID}" != "com.btt.BTTReminder" ]; then
            echo "Error: Unexpected bundle identifier '${BUNDLE_ID}'" >&2
            exit 1
          fi
          if [ "${FEED_URL}" != "https://raw.githubusercontent.com/truthrive/btt-reminder-releases/main/appcast.xml" ]; then
            echo "Error: Unexpected SUFeedURL '${FEED_URL}'" >&2
            exit 1
          fi
          if [ -z "${PUBLIC_KEY}" ]; then
            echo "Error: SUPublicEDKey is missing" >&2
            exit 1
          fi
          if [ "${AUTO_CHECKS}" != "true" ] || [ "${AUTO_UPDATE}" != "true" ]; then
            echo "Error: Automatic update settings must be true" >&2
            exit 1
          fi

          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "app_path=${APP_PATH}" >> "$GITHUB_OUTPUT"
          echo "Built Info.plist validated: ${VERSION} (${BUILD})."
          cd ..

      - name: Download Official Sparkle Tooling
        run: |
          SPARKLE_VERSION="2.6.4"
          mkdir -p /tmp/sparkle_tools
          curl -sSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o /tmp/Sparkle.tar.xz
          tar -xf /tmp/Sparkle.tar.xz -C /tmp/sparkle_tools
          test -x "/tmp/sparkle_tools/bin/sign_update" || { echo "Error: Sparkle sign_update not found" >&2; exit 1; }

      - name: Package and Sign Update with Sparkle
        id: sign_step
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ steps.version_info.outputs.app_version }}
          APP_PATH: ${{ steps.version_info.outputs.app_path }}
        run: |
          test -n "${SPARKLE_ED_PRIVATE_KEY}" || { echo "Error: Sparkle private key missing" >&2; exit 1; }

          ZIP_NAME="BTT-Reminder-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_NAME}"

          SIGN_OUTPUT=$(printf '%s' "${SPARKLE_ED_PRIVATE_KEY}" | /tmp/sparkle_tools/bin/sign_update --ed-key-file - "${ZIP_NAME}")
          ED_SIG=$(echo "${SIGN_OUTPUT}" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          ZIP_LENGTH=$(echo "${SIGN_OUTPUT}" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          test -n "${ED_SIG}" || { echo "Error: Sparkle signature missing" >&2; exit 1; }
          test -n "${ZIP_LENGTH}" || { echo "Error: Sparkle archive length missing" >&2; exit 1; }

          echo "ed_sig=${ED_SIG}" >> "$GITHUB_OUTPUT"
          echo "zip_length=${ZIP_LENGTH}" >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Sparkle signature generated successfully."

      - name: Generate Release Notes
        env:
          VERSION: ${{ steps.version_info.outputs.app_version }}
          USER_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          python3 - << 'PYEOF'
          import html
          import os

          version = os.environ["VERSION"]
          notes = (os.environ.get("USER_NOTES") or "").strip()
          if not notes:
              items = [
                  "Fixed new-line/Return handling in the Notes editor.",
                  "Fixed Note title editing behavior.",
                  "Fixed rich-text editor state synchronization.",
                  "Improved formatting/editor reliability.",
                  "Added regression coverage for Notes editing and persistence."
              ]
              notes_html = "<p>Hotfix for Notes in Version 2:</p><ul>" + "".join(f"<li>{item}</li>" for item in items) + "</ul>"
          else:
              notes_html = f"<p>{html.escape(notes)}</p>"

          html_content = f"""<!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>BTT Reminder Release Notes</title>
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; color: #333; line-height: 1.5; }}
              h2 {{ color: #d84a75; }}
              ul {{ padding-left: 20px; }}
              li {{ margin-bottom: 6px; }}
            </style>
          </head>
          <body>
            <h2>BTT Reminder v{html.escape(version)}</h2>
            {notes_html}
          </body>
          </html>
          """

          filename = f"release-notes-{version}.html"
          lines = [line.lstrip() for line in html_content.strip().splitlines()]
          with open(filename, "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"Created {filename} successfully.")
          PYEOF

      - name: Update Appcast Feed
        env:
          VERSION: ${{ steps.version_info.outputs.app_version }}
          BUILD: ${{ steps.version_info.outputs.app_build }}
          ED_SIG: ${{ steps.sign_step.outputs.ed_sig }}
          ZIP_LENGTH: ${{ steps.sign_step.outputs.zip_length }}
        run: |
          python3 - << 'PYEOF'
          import os
          from datetime import datetime, timezone

          version = os.environ["VERSION"]
          build = os.environ["BUILD"]
          ed_sig = os.environ["ED_SIG"]
          zip_length = os.environ["ZIP_LENGTH"]
          pub_date = datetime.now(timezone.utc).strftime("%a, %d %b %Y %H:%M:%S +0000")

          new_item = "\n".join([
              "    <item>",
              f"      <title>Version {version}</title>",
              f"      <sparkle:releaseNotesLink>https://raw.githubusercontent.com/truthrive/btt-reminder-releases/main/release-notes-{version}.html</sparkle:releaseNotesLink>",
              f"      <pubDate>{pub_date}</pubDate>",
              "      <enclosure",
              f'        url="https://github.com/truthrive/btt-reminder-releases/releases/download/v{version}/BTT-Reminder-{version}.zip"',
              f'        sparkle:version="{build}"',
              f'        sparkle:shortVersionString="{version}"',
              f'        sparkle:edSignature="{ed_sig}"',
              f'        length="{zip_length}"',
              '        type="application/octet-stream" />',
              "    </item>",
          ])

          with open("appcast.xml", "r", encoding="utf-8") as f:
              content = f.read()

          if f'sparkle:shortVersionString="{version}"' in content:
              print(f"Version {version} already present in appcast.xml. Skipping insertion.")
          elif "<item>" in content:
              content = content.replace("<item>", new_item.strip() + "\n    <item>", 1)
              with open("appcast.xml", "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Successfully prepended version {version} to appcast.xml")
          else:
              content = content.replace("</channel>", new_item + "\n  </channel>")
              with open("appcast.xml", "w", encoding="utf-8") as f:
                  f.write(content)
              print(f"Successfully inserted version {version} into empty appcast.xml")
          PYEOF

      - name: Publish Release and Commit Appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_info.outputs.app_version }}
          BUILD: ${{ steps.version_info.outputs.app_build }}
          ZIP_NAME: ${{ steps.sign_step.outputs.zip_name }}
          USER_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          rm -rf source

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists. Checking source lock..."
            BODY=$(gh release view "v${VERSION}" --json body -q .body)
            if echo "${BODY}" | grep -q "${SOURCE_SHA}"; then
              gh release upload "v${VERSION}" "${ZIP_NAME}" --clobber
            else
              echo "Error: Release v${VERSION} exists with a different source SHA." >&2
              exit 1
            fi
          else
            python3 - << 'PYEOF'
          import os

          version = os.environ["VERSION"]
          build = os.environ["BUILD"]
          source_sha = os.environ["SOURCE_SHA"]
          notes = (os.environ.get("USER_NOTES") or "").strip()
          if not notes:
              notes = "Hotfix for Notes in Version 2:\n\n- Fixed new-line/Return handling in the Notes editor.\n- Fixed Note title editing behavior.\n- Fixed rich-text editor state synchronization.\n- Improved formatting/editor reliability.\n- Added regression coverage for Notes editing and persistence."

          body = f"BTT Reminder v{version} ({build})\n\n{notes}\n\nVerified Source SHA: `{source_sha}`\n"
          with open("release_body.txt", "w", encoding="utf-8") as f:
              f.write(body)
          PYEOF

            gh release create "v${VERSION}" "${ZIP_NAME}" \
              --title "BTT Reminder v${VERSION}" \
              --notes-file release_body.txt
            rm -f release_body.txt
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml "release-notes-${VERSION}.html"

          if git diff --staged --quiet; then
            echo "No appcast/release-note changes to commit."
          else
            git commit -m "release: publish v${VERSION} (build ${BUILD}) [source: ${SOURCE_SHA:0:7}]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Verify Published Output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version_info.outputs.app_version }}
          BUILD: ${{ steps.version_info.outputs.app_build }}
          ZIP_NAME: ${{ steps.sign_step.outputs.zip_name }}
        run: |
          echo "Verifying local appcast.xml..."
          grep -q "sparkle:version=\"${BUILD}\"" appcast.xml || { echo "Error: local appcast missing build ${BUILD}" >&2; exit 1; }
          grep -q "sparkle:shortVersionString=\"${VERSION}\"" appcast.xml || { echo "Error: local appcast missing version ${VERSION}" >&2; exit 1; }
          grep -q 'sparkle:version="10"' appcast.xml || { echo "Error: v2.0.0 build 10 missing from local appcast" >&2; exit 1; }
          grep -q 'sparkle:shortVersionString="2.0.0"' appcast.xml || { echo "Error: v2.0.0 missing from local appcast" >&2; exit 1; }
          grep -q 'sparkle:version="9"' appcast.xml || { echo "Error: v1.0.8 build 9 missing from local appcast" >&2; exit 1; }
          grep -q 'sparkle:shortVersionString="1.0.8"' appcast.xml || { echo "Error: v1.0.8 missing from local appcast" >&2; exit 1; }
          grep -q 'sparkle:version="8"' appcast.xml || { echo "Error: v1.0.7 build 8 missing from local appcast" >&2; exit 1; }
          grep -q 'sparkle:shortVersionString="1.0.7"' appcast.xml || { echo "Error: v1.0.7 missing from local appcast" >&2; exit 1; }

          gh release view "v${VERSION}" --json assets | grep -q "${ZIP_NAME}" || { echo "Error: ${ZIP_NAME} missing from release v${VERSION}" >&2; exit 1; }
          BODY=$(gh release view "v${VERSION}" --json body -q .body)
          echo "${BODY}" | grep -q "${SOURCE_SHA}" || { echo "Error: release body source SHA mismatch" >&2; exit 1; }

          APPCAST_API_URL="https://api.github.com/repos/truthrive/btt-reminder-releases/contents/appcast.xml"
          APPCAST_RAW_URL="https://raw.githubusercontent.com/truthrive/btt-reminder-releases/main/appcast.xml"
          REMOTE_FILE=$(mktemp)
          VERIFIED=false

          for i in $(seq 1 30); do
            TIMESTAMP=$(date +%s)
            HTTP_STATUS=$(curl -s -H "Accept: application/vnd.github.raw+json" \
                                 -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                                 -H "Cache-Control: no-cache" \
                                 -o "${REMOTE_FILE}" \
                                 -w "%{http_code}" \
                                 "${APPCAST_API_URL}")

            if [ "${HTTP_STATUS}" = "200" ] && \
               grep -q "sparkle:version=\"${BUILD}\"" "${REMOTE_FILE}" && \
               grep -q "sparkle:shortVersionString=\"${VERSION}\"" "${REMOTE_FILE}"; then
              VERIFIED=true
              break
            fi

            HTTP_STATUS=$(curl -s -H "Cache-Control: no-cache" \
                                 -o "${REMOTE_FILE}" \
                                 -w "%{http_code}" \
                                 "${APPCAST_RAW_URL}?t=${TIMESTAMP}")

            if [ "${HTTP_STATUS}" = "200" ] && \
               grep -q "sparkle:version=\"${BUILD}\"" "${REMOTE_FILE}" && \
               grep -q "sparkle:shortVersionString=\"${VERSION}\"" "${REMOTE_FILE}"; then
              VERIFIED=true
              break
            fi

            echo "Attempt ${i}/30: remote appcast not updated yet (HTTP ${HTTP_STATUS}); retrying in 3s..."
            sleep 3
          done

          if [ "${VERIFIED}" != "true" ]; then
            echo "Error: remote appcast could not be verified after 30 attempts" >&2
            cat "${REMOTE_FILE}" >&2
            rm -f "${REMOTE_FILE}"
            exit 1
          fi

          grep -q "sparkle:version=\"${BUILD}\"" "${REMOTE_FILE}" || { echo "Error: remote appcast missing build ${BUILD}" >&2; exit 1; }
          grep -q "sparkle:shortVersionString=\"${VERSION}\"" "${REMOTE_FILE}" || { echo "Error: remote appcast missing version ${VERSION}" >&2; exit 1; }
          grep -q 'sparkle:version="10"' "${REMOTE_FILE}" || { echo "Error: remote appcast missing v2.0.0 build 10" >&2; exit 1; }
          grep -q 'sparkle:shortVersionString="2.0.0"' "${REMOTE_FILE}" || { echo "Error: remote appcast missing v2.0.0" >&2; exit 1; }
          grep -q 'sparkle:version="9"' "${REMOTE_FILE}" || { echo "Error: remote appcast missing v1.0.8 build 9" >&2; exit 1; }
          grep -q 'sparkle:shortVersionString="1.0.8"' "${REMOTE_FILE}" || { echo "Error: remote appcast missing v1.0.8" >&2; exit 1; }
          grep -q 'sparkle:version="8"' "${REMOTE_FILE}" || { echo "Error: remote appcast missing v1.0.7 build 8" >&2; exit 1; }
          grep -q 'sparkle:shortVersionString="1.0.7"' "${REMOTE_FILE}" || { echo "Error: remote appcast missing v1.0.7" >&2; exit 1; }
          grep -q 'sparkle:edSignature="' "${REMOTE_FILE}" || { echo "Error: remote appcast missing Sparkle signature" >&2; exit 1; }
          grep -q 'length="' "${REMOTE_FILE}" || { echo "Error: remote appcast missing archive length" >&2; exit 1; }

          rm -f "${REMOTE_FILE}"
          echo "Published output verified: ${VERSION} (${BUILD}); v1.0.8 and v1.0.7 preserved."

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BTT-Reminder-Release
          path: |
            BTT-Reminder-*.zip
            appcast.xml
            release-notes-*.html
          if-no-files-found: error
          retention-days: 30